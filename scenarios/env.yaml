# Default layout: everything under ./data (relative to the repository root).
# Edit the paths (or override them on the command line) if your data lives elsewhere.
env:
  datasets_folder: ./data/preprocessed        # preprocessed HDF5 datasets
  assets_folder: ./assets/                    # object assets, shape mappings, checkpoints
  experiments_folder: ./experiments           # training runs, samples, evaluation
  smpl_all_models_folder: ./data/body_models/smplx/models
  smplx_folder: ${env.smpl_all_models_folder}/smplx
  smplh_amass_folder: ${env.smpl_all_models_folder}/smplh_amass
  # raw dataset roots for preprocessing
  amass_folder: ./data/raw/amass/
  behave_folder: ./data/raw/behave
  behave_converted_folder: ./data/raw/behave/smplh2x_smplfitter   # output of convert_behave_smplh2x.py
  omomo_folder: ./data/raw/omomo/
  smplfitter_data_folder: ./data/body_models/smplx                # smplfitter DATA_ROOT (body_models/ inside)
